
<div class="container">

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1>{{ titulo }}</h1>
    <p>Controle de consumo dos apartamentos</p>
  </header>

  <!-- Apartamentos cadastrados -->
  <section class="card">
    <h2>Apartamentos cadastrados</h2>

    <div class="apartamentos">
      @for (apartamento of apartamentos; track apartamento.id) {
        <span class="apartamento">
          Apartamento {{ apartamento.numero }}
        </span>
      }
    </div>
  </section>

  <!-- Componente filho: Formulário -->
  <section class="card">

    <!-- [ ]	Property Binding	Vincular valores a propriedades   utiliza @Input() para enviar dados do pai para o filho.-->
    <!-- ( )	Event Binding	Escutar eventos e executar ações      utiliza @Output() para enviar um evento do filho para o pai. -->

    <app-formulario
      [apartamentos]="apartamentos"               
      (novaLeitura)="receberLeitura($event)">
    </app-formulario>
  </section>



  <!-- Componente filho: Lista -->
  <section class="card">
    <app-lista [resultado]="resultadoConsumo"></app-lista>
  </section>

</div>
